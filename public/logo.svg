<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer blue field -->
  <circle cx="100" cy="100" r="98" fill="#0039A6"/>

  <!-- Red band -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#D52B1E" stroke-width="6"/>

  <!-- White divider ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Inner white field -->
  <circle cx="100" cy="100" r="75" fill="white"/>

  <!-- Inner red accent -->
  <circle cx="100" cy="100" r="69" fill="none" stroke="#D52B1E" stroke-width="2"/>

  <!-- Condor silhouette -->
  <path d="
    M 100,72
    L 105,75
    C 116,76 132,69 146,63
    C 156,60 164,62 166,66
    C 164,72 158,76 149,77
    C 139,79 127,83 117,89
    C 113,92 109,97 107,102
    L 103,111
    C 102,114 100,115 100,115
    C 100,115 98,114 97,111
    L 93,102
    C 91,97 87,92 83,89
    C 73,83 61,79 51,77
    C 42,76 36,72 34,66
    C 36,62 44,60 54,63
    C 68,69 84,76 95,75
    Z
  " fill="#0039A6"/>

  <!-- Condor head -->
  <ellipse cx="100" cy="68" rx="5.5" ry="5" fill="#0039A6"/>

  <!-- Condor white collar -->
  <ellipse cx="100" cy="76" rx="4" ry="2.5" fill="white"/>

  <!-- Star above condor -->
  <text x="100" y="59" text-anchor="middle" font-size="8" fill="#D52B1E">★</text>

  <!-- Poop silhouette below condor -->
  <!-- Base -->
  <ellipse cx="100" cy="138" rx="13" ry="5.5" fill="#0039A6"/>
  <!-- Middle -->
  <ellipse cx="100" cy="130" rx="10" ry="5" fill="#0039A6"/>
  <!-- Fill gap base-middle -->
  <rect x="90" y="128" width="20" height="11" fill="#0039A6"/>
  <!-- Top bump -->
  <ellipse cx="100" cy="123" rx="7" ry="5" fill="#0039A6"/>
  <!-- Fill gap middle-top -->
  <rect x="91" y="121" width="18" height="10" fill="#0039A6"/>
  <!-- Curl tip -->
  <path d="M 100,118 C 100,114 103,111 106,112 C 109,113 109,117 106,119 C 104,120 101,119 100,118 Z" fill="#0039A6"/>

  <!-- Small stars flanking condor -->
  <text x="68" y="83" text-anchor="middle" font-size="7" fill="#D52B1E">★</text>
  <text x="132" y="83" text-anchor="middle" font-size="7" fill="#D52B1E">★</text>
</svg>
